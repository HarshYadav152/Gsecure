name: CI: Lint & Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        working-directory: gsecure
        run: npm ci

      - name: Run ESLint
        working-directory: gsecure
        run: npm run lint

      - name: Run production build
        working-directory: gsecure
        run: npm run build
